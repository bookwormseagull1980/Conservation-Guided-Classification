name: CGC CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest hypothesis

      - name: Run unit tests (L0)
        run: python -m pytest tests/ -v --tb=short -q
        timeout-minutes: 10

      - name: Run property-based tests
        run: python tests/test_properties.py
        timeout-minutes: 10

      - name: Run edge case tests
        run: python tests/test_edge_cases.py
        timeout-minutes: 10

      - name: Run cgc-verify (L1+L2+L4)
        run: cgc-verify --verbose
        timeout-minutes: 10

      - name: Run classification checks (all channels)
        run: |
          cgc-run --operator tmunu
          cgc-run --operator f2
          cgc-run --operator fermion
          cgc-run --operator higgs
        timeout-minutes: 10

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check cgc/
        timeout-minutes: 5

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy cgc/engine/ --ignore-missing-imports --show-error-codes
        timeout-minutes: 5

      - name: Summary
        if: always()
        run: |
          echo "----------------------------------------"
          echo "  CGC CI Complete (Python ${{ matrix.python-version }})"
          echo "  L0: Unit tests (38)"
          echo "  P1: Property-based + Edge case tests (27)"
          echo "  L1+L2+L4: Reference verification (11)"
          echo "  CLI: 4-channel classification"
          echo "  Lint: ruff | Type: mypy"
          echo "----------------------------------------"
