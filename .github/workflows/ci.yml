name: CGC CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"   # Weekly Sunday 00:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════
  # LINT
  # ═════════════════════════════════════════════════════════════════
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint deps
        run: pip install mypy ruff

      - name: Ruff check
        run: ruff check cgc/

      - name: Ruff format check
        run: ruff format --check cgc/

      - name: mypy type check
        run: mypy cgc/engine/ --show-error-codes --pretty

  # ═════════════════════════════════════════════════════════════════
  # TEST — Unit + Integration + Coverage
  # ═════════════════════════════════════════════════════════════════
  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python cgc/tests/run_all.py

      - name: Pytest with coverage
        run: |
          pip install pytest-cov
          pytest cgc/tests/ \
            --cov=cgc.engine \
            --cov=cgc.channels \
            --cov-report=term-missing \
            --cov-report=xml:coverage-${{ matrix.python }}.xml \
            -m "not slow"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cgc-${{ matrix.python }}
          path: coverage-${{ matrix.python }}.xml

  # ═════════════════════════════════════════════════════════════════
  # BENCHMARK — Performance Regression
  # ═════════════════════════════════════════════════════════════════
  benchmark:
    name: Benchmarks (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e .

      - name: Run cgc-verify
        run: cgc-verify --verbose

      - name: Regenerate reference (if changed)
        run: |
          python -m cgc.benchmarks.generate_reference
          if ! git diff --quiet cgc/benchmarks/reference_output.json; then
            echo "⚠ reference_output.json changed — this commit modifies physical output"
            git diff cgc/benchmarks/reference_output.json
          fi

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cgc-benchmark-${{ matrix.python }}
          path: cgc/benchmarks/reference_output.json

  # ═════════════════════════════════════════════════════════════════
  # SCHEMA — JSON Schema Validation
  # ═════════════════════════════════════════════════════════════════
  schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install jsonschema

      - name: Validate config schemas
        run: |
          python -c "
          import json, jsonschema, os, sys
          # Validate reference_output.json against any schemas in docs/
          ref_path = 'cgc/benchmarks/reference_output.json'
          if os.path.exists(ref_path):
              with open(ref_path) as f:
                  data = json.load(f)
              print(f'reference_output.json: {len(data)} top-level keys')
              # Check required keys
              required = ['schema_version', 'physical_constants', 'channels', 'dyson_schwinger']
              missing = [k for k in required if k not in data]
              if missing:
                  print(f'MISSING keys: {missing}')
                  sys.exit(1)
              print('All required keys present ✓')
          "
